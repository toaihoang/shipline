# Shipline builds itself:
#   dotnet run --project src/Shipline.Cli -- run
name: shipline
env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    timeout: 15m
    steps:
      - name: Restore
        run: dotnet restore Shipline.slnx
      - name: Build
        run: dotnet build Shipline.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Shipline.slnx -c Release --no-build
      - name: Lint this pipeline
        run: dotnet src/Shipline.Cli/bin/Release/net10.0/shipline.dll lint
