name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Shipline.slnx

      - name: Build
        run: dotnet build Shipline.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Shipline.slnx --configuration Release --no-build

      - name: Lint the Shipline pipeline with Shipline
        run: dotnet src/Shipline.Cli/bin/Release/net10.0/shipline.dll lint
